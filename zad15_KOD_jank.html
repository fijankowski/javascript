<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rozkład ułamka egipskiego na dwa takie same ułamki</title>
</head>
<body>
    <script type="text/javascript">
        var m_jan = prompt("Podaj m:", "3");
        m_jan = parseFloat(m_jan);
        
        var m2 = m_jan * 2;
        
        document.write("1/" + m_jan + " = 1/" + m2 + " + 1/" + m2);
    </script>
</body>
