<html>

  <meta charset="UTF-8"> 
  <link rel="stylesheet" href="styl.css"> 
 </head> 
<body> 
 <script type="text/javascript"> 
  function pole() 
   { 
 var a_jan= parseFloat(document.getElementById('dlugosc').value); 
 var b_jan= a_jan*a_jan; 
        document.getElementById("nazwa").innerHTML ="Pole kwadratu= "+b_jan.toFixed(2)+" cm^2";  
   } 
  function obwod() 
   { 
 var a_jan= parseFloat(document.getElementById('dlugosc').value); 
 var b_jan= 4*a_jan; 
        document.getElementById("nazwa").innerHTML ="Obwód kwadratu= "+b_jan.toFixed(2)+" cm";  
   } 
 </script> 
  <h1>Wszystko o KWADRACIE</h1><br><br> 
  Podaj długość boku: <input type="text" id="dlugosc" value="podaj długość"> cm<br><br><br> 
  <input type="button" name="pole" value="Oblicz pole" Onclick="pole()"><br><br> 
  <input type="button" name="obwod" value="Oblicz obwod" Onclick="obwod()"><br><br> 
  <div  style="color:red;font-size:50px;"id="nazwa"></div> 
</body>
