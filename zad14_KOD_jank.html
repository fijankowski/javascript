<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rozkład ułamka egipskiego na trzy ułamki</title>
</head>
<body>
    <script type="text/javascript">
        var m_jan = prompt("Podaj m:", "4");
        m_jan = parseFloat(m_jan);
        
        var m1 = m_jan + 1;
        var m2 = m1 + 1;
        var m3 = m1 * m2;
        var m4 = m_jan * m1;
        
        document.write("1/" + m_jan + " = 1/" + m2 + " + 1/" + m3 + " + 1/" + m4);
    </script>
</body>
